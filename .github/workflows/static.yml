name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch (i.e., master)
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Optional: If you need to rebuild the project locally during the CI process
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Use the version you need
          
      - name: Install dependencies
        run: |
          npm install

      - name: Build the project
        run: |
          npm run build # Make sure this generates the build folder

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the build folder to be deployed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'  # Only the build folder should be uploaded

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
